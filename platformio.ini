[platformio]
default_envs = blynk-mqtt

[env]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

[env:esp32-check]
build_src_filter = -<*> +<board_check.cpp>

[env:smart-plug]
build_src_filter = -<*> +<main.cpp>
lib_deps = blynkkk/Blynk@1.4.0

[env:blynk-mqtt]
build_src_filter = -<*> +<mqtt_main.cpp>
lib_deps = knolleary/PubSubClient@2.8
